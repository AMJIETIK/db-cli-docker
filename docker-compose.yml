services:
  db:
    image: postgres:15
    container_name: stormside-postgres
    restart: always
    env_file: ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
    container_name: stormside-backend
    restart: always
    depends_on:
      - db
    env_file:
      - backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ./static:/app/static
      - ./backend:/app
    working_dir: /app

volumes:
  pgdata: